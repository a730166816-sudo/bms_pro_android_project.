# bms_pro_android_pname: Build Real BMS Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Find Project and Build APK
        run: |
          MAIN_PATH=$(find . -name "main.dart" | head -n 1)
          if [ -n "$MAIN_PATH" ]; then
            PROJECT_DIR=$(dirname $(dirname "$MAIN_PATH"))
            echo "Found project at: $PROJECT_DIR"
            cd "$PROJECT_DIR"
          else
            flutter create bms_fallback --project-name flutter_bms_pro
            cd bms_fallback
          fi
          
          flutter create . --project-name flutter_bms_pro
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/BMS-Pro-Release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BMS-Pro-Release-APK
          path: BMS-Pro-Release.apkroject.
